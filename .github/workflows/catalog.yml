name: فهرس صوت الشيعة
# يجمع فهرس صوت الشيعة للنسخة الخفيفة (بدون مفاتيح)، وينشره في الفرع data.
on:
  push:
    branches: [main]
    paths: ["tools/catalog/**", ".github/workflows/catalog.yml"]
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: true   # a newer run takes over; nothing is lost, progress is published every 30 min
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
      - name: Previous catalog
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parser self-test
        run: node tools/catalog/test-parse.mjs
      - name: Is a run due?
        id: due
        run: mkdir -p data && node tools/catalog/due.mjs data
      - name: Collect, publishing every 30 minutes
        if: steps.due.outputs.run == 'true'
        env:
          CRAWL_MINUTES: "30"
          CRAWL_DELAY_MS: "900"
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          publish() {
            rm -rf /tmp/pub && cp -r data /tmp/pub && rm -rf /tmp/pub/.git && cd /tmp/pub
            git init -q -b data
            git config user.name "qasida-catalog"
            git config user.email "actions@users.noreply.github.com"
            git add -A && git commit -qm "catalog $(date -u +%F-%H%M)"
            git push -qf "$PUSH_URL" data
            cd "$GITHUB_WORKSPACE"
          }
          for i in 1 2 3 4 5 6 7; do
            node tools/catalog/crawl.mjs data
            publish
            if node -e "process.exit(JSON.parse(require('fs').readFileSync('data/state.json','utf8')).done ? 0 : 1)"; then echo "catalog complete"; break; fi
          done
