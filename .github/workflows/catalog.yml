name: فهرس صوت الشيعة
# يجمع فهرس صوت الشيعة وكلمات القصائد للتطبيق، وينشرهما في الفرع data.
# كل ٤ ساعات: الجديد فقط (صفحة «الجديد» في صوت الشيعة + آخر المنشورات في مصادر الكلمات)؛ ومرة في الأسبوع مرور كامل.
on:
  push:
    branches: [main]
    paths: ["tools/catalog/**", "tools/lyrics/**", "lite/words.js", "match.js", ".github/workflows/catalog.yml"]
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false  # a run waits for the one before it (each publishes its progress)
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Previous catalog
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parser self-test
        run: node tools/catalog/test-parse.mjs
      - name: Is a run due?
        id: due
        run: mkdir -p data && node tools/catalog/due.mjs data
      - name: Poem texts (new posts; older Telegram posts until complete)
        id: lyrics
        env:
          LYRICS_MINUTES: "40"
        run: node tools/lyrics/collect.mjs data
      - name: Collect, publishing every 30 minutes
        if: steps.due.outputs.run == 'true'
        env:
          CRAWL_MINUTES: "30"
          CRAWL_DELAY_MS: "900"
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          for i in 1 2 3 4 5 6 7; do
            node tools/catalog/crawl.mjs data
            tools/catalog/publish.sh
            if node -e "process.exit(JSON.parse(require('fs').readFileSync('data/state.json','utf8')).done ? 0 : 1)"; then echo "catalog complete"; break; fi
          done
      - name: Publish poem texts
        if: steps.due.outputs.run != 'true' && steps.lyrics.outputs.changed == 'true'
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: tools/catalog/publish.sh
