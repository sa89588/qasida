name: مكتبة الكتب
# فهرس موحّد للكتب والبحوث من إحدى عشرة مكتبة وقنوات التلكرام — الكتاب الواحد مرة واحدة مع كل مصادره.
# مرة كل يوم: قوائم المكتبات كاملة، وبطاقات كتب مدرسة الفقاهة جزءاً بعد جزء. ينشر في الفرع library.
# البحث داخل نصوص الكتب يجري بمحرك مدرسة الفقاهة نفسه، والتطبيق يفتحه مباشرة؛ لا تُنسخ صفحات أي كتاب.
on:
  push:
    branches: [main]
    paths: ["tools/books/**", "books/words.js", ".github/workflows/books.yml"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Previous catalogue
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: library
          path: books-data
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-test
        run: node tools/books/test.mjs
      - name: Catalogue of the libraries
        env:
          BOOKS_MINUTES: "90"
          BOOKS_RATE: "1.5"
          BOOKS_TG_REQUESTS: "1800"
          BOOKS_PUBLISH: bash tools/books/publish.sh books-data
          BOOKS_BRANCH: library
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: node tools/books/collect.mjs books-data
